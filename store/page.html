<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Đang tải... - TOHO ELECTRIC VN</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <!-- HEADER ĐƠN GIẢN -->
    <header class="bg-white border-b sticky top-0 z-40 shadow-sm py-3 px-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center text-sm font-bold text-red-600 hover:underline">
                <i class="fa-solid fa-arrow-left mr-2"></i> Quay lại trang chủ
            </a>
            <span class="font-black text-lg tracking-tighter text-black">
                STA<span class="text-red-600">R</span>
            </span>
        </div>
    </header>

    <!-- NỘI DUNG CHÍNH SÁCH -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl p-6 md:p-10 shadow-md border space-y-6">
            <h1 id="articleTitle" class="text-2xl md:text-3xl font-black text-red-600 border-b pb-4 uppercase">
                Đang tải nội dung...
            </h1>
            
            <div id="articleContent" class="text-sm md:text-base leading-relaxed text-gray-700 whitespace-pre-line">
                <p class="text-gray-400 italic">Đang lấy dữ liệu từ hệ thống...</p>
            </div>
        </div>
    </main>

    <script>
    const GOOGLE_SHEET_POLICY_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWm2p0bF1cb1jjEdiol9BUZzVnH53XEvwpj9DW9QfOmgmbgj9VIX-QqoXXA6QCP-YvPQQQDGOaVrEW/pub?gid=607784045&single=true&output=csv';

    // Hàm parser CSV chuẩn hỗ trợ dữ liệu có dấu xuống dòng trong ô
    function parseCSV(text) {
        let p = '', c = '', r = [];
        let q = false;
        let row = [''];
        for (let i = 0; i < text.length; i++) {
            c = text[i];
            let next = text[i+1];
            if (c === '"') {
                if (q && next === '"') { row[row.length - 1] += '"'; i++; }
                else { q = !q; }
            } else if (c === ',' && !q) {
                row.push('');
            } else if ((c === '\r' || c === '\n') && !q) {
                if (c === '\r' && next === '\n') { i++; }
                r.push(row);
                row = [''];
            } else {
                row[row.length - 1] += c;
            }
        }
        if (row.length > 1 || row[0] !== '') { r.push(row); }
        return r;
    }

    async function loadPageContent() {
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        if (!slug) {
            document.getElementById('articleTitle').innerText = "Không tìm thấy trang";
            document.getElementById('articleContent').innerText = "Đường dẫn không hợp lệ.";
            return;
        }

        document.getElementById('pageTitle').innerText = `${slug} - TOHO ELECTRIC VN`;
        document.getElementById('articleTitle').innerText = slug;

        try {
            const res = await fetch(GOOGLE_SHEET_POLICY_CSV_URL + '&t=' + new Date().getTime());
            const csvText = await res.text();
            
            // Đọc CSV theo hàm chuẩn
            const rows = parseCSV(csvText);

            let contentFound = "";

            rows.forEach(cols => {
                if (cols.length >= 2) {
                    const title = cols[0].trim();
                    const content = cols[1].trim();
                    if (title.toLowerCase() === slug.toLowerCase()) {
                        contentFound = content;
                    }
                }
            });

            if (contentFound) {
                document.getElementById('articleContent').innerText = contentFound;
            } else {
                document.getElementById('articleContent').innerText = "Nội dung cho trang này đang được cập nhật.";
            }

        } catch (err) {
            console.error("Lỗi tải trang:", err);
            document.getElementById('articleContent').innerText = "Không thể kết nối dữ liệu. Vui lòng thử lại sau.";
        }
    }

    window.onload = loadPageContent;
</script>
</body>
</html>
